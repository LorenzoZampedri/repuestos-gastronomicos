version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: repuestos_db
    environment:
      POSTGRES_DB: repuestos_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-repuestos123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d repuestos_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - repuestos-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repuestos_backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/repuestos_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-repuestos123}
      JWT_SECRET: ${JWT_SECRET:-repuestos-secret-key-2024-change-in-production}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2
    networks:
      - repuestos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repuestos_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - repuestos-network

volumes:
  pgdata:

networks:
  repuestos-network:
    driver: bridge
