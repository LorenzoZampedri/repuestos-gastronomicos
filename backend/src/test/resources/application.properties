# Configuración SOLO para tests (H2 en memoria). La configuración de producción
# sigue siendo PostgreSQL y vive en src/main/resources/application.properties.
spring.datasource.url=jdbc:h2:mem:repuestos-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Directorio de avatares para tests (aislado del workspace)
app.avatar-dir=target/test-avatares
app.upload-dir=target/test-uploads

# JWT de tests (clave de al menos 32 bytes para HS256)
JWT_SECRET=clave-de-test-suficientemente-larga-para-hs256-123456
app.vista-como.ttl-minutos=30
